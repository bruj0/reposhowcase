name: Deploy

# Publishing is Direct Upload, not a Git-integrated Pages project. A
# Git-integrated project cannot later be switched to Direct Upload, and it
# needs the Cloudflare GitHub App over a browser OAuth flow, which cannot
# reach a private repository from CI. Direct Upload is the portable choice:
# the same workflow works for a fork with one secret added.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race for the production alias.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # site.config.json is the single source of truth for the project name,
      # the output directory and the production branch. Reading it here means
      # a rename does not require a second edit in this file.
      - name: Read site config
        id: site
        run: |
          echo "project=$(jq -r .projectName site.config.json)" >> "$GITHUB_OUTPUT"
          echo "output=$(jq -r .buildOutputDir site.config.json)" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .productionBranch site.config.json)" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build
        run: npm run build

      # The catalogue data is committed, so the build needs no network and no
      # GitHub token. Refreshing repos.json is a deliberate local step
      # (`npm run refresh`), because it should arrive as a reviewable diff.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Run 'npm run cf:setup' locally and add the token from .env as a repository secret."
            exit 1
          fi
          npx wrangler pages deploy "${{ steps.site.outputs.output }}" \
            --project-name "${{ steps.site.outputs.project }}" \
            --branch "${{ steps.site.outputs.branch }}" \
            --commit-hash "${{ github.sha }}" \
            --commit-message "${{ github.event.head_commit.message }}"
