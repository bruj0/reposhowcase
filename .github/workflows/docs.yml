# Build the documentation site and publish it to GitHub Pages.
#
# The site is MkDocs Material over `site_src/`, which
# `scripts/build-docs-site.mjs` assembles from the essay, the README and the two
# pages in `docs/`. The staging step runs before every build, so adding a page
# means editing that script and `mkdocs.yml`, never copying a file by hand.
#
# Publishing is a branch deploy to `gh-pages`, which is what
# Settings -> Pages -> Source must point at. `force_orphan` keeps that branch at
# one commit so generated HTML does not accumulate history.
#
# `--strict` turns every MkDocs warning into a failure. A broken internal link
# or a nav entry that names a missing page stops the build here rather than
# shipping a page with a dead link.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "essay/**"
      - "docs/**"
      - "assets/**"
      - "README.md"
      - "LICENSE"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/sync-essay.mjs"
      - "scripts/build-docs-site.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "essay/**"
      - "docs/**"
      - "assets/**"
      - "README.md"
      - "LICENSE"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/sync-essay.mjs"
      - "scripts/build-docs-site.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Assemble the site source
        run: node scripts/build-docs-site.mjs

      - name: Build the site
        run: mkdocs build --strict --site-dir _site

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "docs: deploy site (${{ github.sha }})"
