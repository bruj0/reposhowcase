# MkDocs site for the published documentation.
#
# `docs_dir` is `site_src/`, which `scripts/build-docs-site.mjs` assembles from
# four documents in three places: the essay, the README, and the two pages in
# `docs/`. Pointing `docs_dir` at the repository root instead would publish
# `node_modules/`, `dist/` and `.git/`, because MkDocs copies everything under
# `docs_dir` into the site.
#
# `site_src/` and `essay/index.md` are both generated. Edit the canonical essay
# in personal-docs and run `scripts/sync-essay.mjs`; edit the README and `docs/`
# in place. Nothing is edited under `site_src/`.

site_name: Repo Showcase
site_description: A catalogue page for the repositories you shipped, and the essay on how it was researched, planned and built.
site_url: https://bruj0.github.io/reposhowcase/
repo_url: https://github.com/bruj0/reposhowcase
repo_name: bruj0/reposhowcase
copyright: Rodrigo A. Diaz Leven

docs_dir: site_src
site_dir: site

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/robot-outline
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Essay: index.md
  - Overview: readme.md
  - Deployment: deployment.md
  - Hosting: hosting.md
