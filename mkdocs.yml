# MkDocs site for the published essay.
#
# `docs_dir` is `essay/`, not the default `docs/`. The `docs/` directory in
# this repository holds reference material for the Astro project, and pointing
# MkDocs at it would publish that instead of the essay.
#
# `essay/index.md` is generated by `scripts/sync-essay.mjs`. Edit the canonical
# file in personal-docs, then re-run the script; a hand edit here is overwritten.

site_name: How Agents Made a Small Idea Worth Building
site_description: How agent-assisted research, planning and implementation made a small catalogue project worth building.
site_url: https://bruj0.github.io/reposhowcase/
repo_url: https://github.com/bruj0/reposhowcase
repo_name: bruj0/reposhowcase
edit_uri: edit/main/essay/
copyright: Rodrigo A. Diaz Leven

docs_dir: essay
site_dir: site

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/robot-outline
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Essay: index.md
